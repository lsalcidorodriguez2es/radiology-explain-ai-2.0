name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias (CPU)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt
      - name: Compilación
        run: python -m py_compile app.py validacion/experimentos.py
      - name: Pruebas extremo a extremo
        run: pytest -q tests
      - name: Experimentos de validación
        run: python validacion/experimentos.py
      - uses: actions/upload-artifact@v4
        with:
          name: resultados-validacion
          path: validacion/resultados.json
